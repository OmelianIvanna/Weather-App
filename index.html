<!DOCTYPE html>
<html lang="en">
    <head>
        <title>My Weather App</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Darker+Grotesque:wght@300..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    </head>
    <body> 
<div id="unitModal" class="unit-modal">
    <div class="unit-modal-content">

        <button id="closeUnitModalBtn" class="unit-close-btn">×</button>

        <h2>Choose Temperature Unit</h2>

        <div class="unit-buttons">
            <button id="celsiusBtn">°C Celsius</button>
            <button id="fahrenheitBtn">°F Fahrenheit</button>
        </div>

    </div>
</div>

        <div class="weather-overlay" id="weatherOverlay"></div>
        <h1>Weather App</h1>

<div id="container">
        <div class="top-row">
            <div class="search-row">
                <input id="cityInput" type="text" placeholder="Enter city name">
                <button id="searchBtn">Search</button>
                 <div id="historyDropdown"></div>
            </div>
             
            <button id="locationBtn" class="location-btn">Use Current Location</button>

            <button id="themeBtn" class="theme-switch" aria-label="Toggle dark mode">
    <span class="theme-icon sun">☀️</span>
    <span class="theme-icon moon">🌙</span>
    <span class="theme-switch-circle"></span>
           </button>

           <button id="unitSettingsBtn" class="unit-settings-btn">⚙️</button>
        </div>
        <div class="city-header">
            <div id="result"></div>
        </div>

        <div id="forecast"></div>

        <div id="mapBox"></div>
        
        <div class="bottom-gradient" id="bottomGradient"></div>
</div>

        <script src="script.js"></script>
    </body>
</html>
